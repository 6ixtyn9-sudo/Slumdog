name: Forebet canary sample (cron, read-only, dual-path)
# ============================================================================
# UN-PAUSED 2026-09-28 (was PAUSED earlier the same day; see git history for
# that note). Run 36470920157's --direct-vs-relay-only result showed the
# original pause concern ("this only tests the relay, direct might be fine")
# was itself incomplete: direct FAILED OUTRIGHT from a GitHub runner
# (HTTPError, no response at all), while relay at least got a real response
# (a Cloudflare challenge page). Neither path alone answers "is Forebet
# reachable right now" — so slumdog.forebet.sample_canary was made DUAL-PATH
# instead (relay first, falling back to direct ONCE only on relay failure,
# mirroring fetch_with_fallback's now-measured-per-run behaviour — see both
# functions' docstrings), and this job inherits that for free via
# --canary-only. A red run now means BOTH paths were blocked this sample,
# which is the honest "is our capture blocked right now" signal; a green run
# records which path served in the `probe:canary` annotation.
# ============================================================================
#
# Owner directive, 2026-09-28, after two consecutive site-wide WAF blocks in
# the same afternoon that had served cleanly that morning (run 36419041728,
# run a5e5720): "we've been optimising how MUCH we ask, when the binding
# constraint may be WHEN we ask." This job answers that question cheaply and
# continuously instead of by luck with a 13-minute probe run.
#
# Read-only by construction, same as probe_kickoff_timezone.yml:
# `permissions: contents: read`, nothing committed, no evidence tree, no
# capture. It makes ONE OR TWO HTTP requests (football's tz=0 JSON via the
# relay, then via direct ONLY if the relay leg failed — the same
# discriminator slumdog.forebet.sample_canary/_canary_state already use) and
# exits. `--canary-only` bypasses every other stage in
# scripts/probe_kickoff_timezone.py on purpose — this must never share a
# budget scheduler with the full sweep.
#
# The exit code is deliberately meaningful: 0 when EITHER path served this
# sample, 1 when both did. Sampled every two hours, Actions' own green/red
# run history for this workflow IS the availability map — which UTC hours
# Forebet is reachable from a GitHub runner by at least one path — readable
# at a glance with no owner paste and no annotation fetch required, though
# the annotation (`probe:canary`) also records which path (relay/direct)
# served, or how each one failed, for anyone who wants the detail.
#
# GitHub only fires `schedule` triggers from the repository's default
# branch — this file has no effect pasted anywhere but `main`. That is why
# it is staged here rather than authored directly: an agent token cannot
# push anything under .github/workflows/ (see README.md in this directory),
# and even if it could, a schedule on a session branch would silently never
# fire.
#
# DELETE THIS FILE once the availability map answers the scheduling
# question well enough to pick a serving window for event-day capture (or
# once Forebet's block clears for good and the question stops mattering).
# It is a measurement job, not part of the pipeline — same lifecycle as
# probe_kickoff_timezone.yml itself.
on:
  schedule:
    # Every two hours, offset 17 minutes past the hour (avoid the exact-hour
    # stampede every scheduled Action tends to pile onto). Adjust the
    # cadence freely; the cost is one request per sample, nothing scales
    # with how often this runs except how fine-grained the resulting map is.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      probe_date:
        description: Board date to sample against (YYYY-MM-DD, blank = tomorrow UTC)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # same pin as forward_shadow.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # same pin as forward_shadow.yml
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install --quiet -e .
      - name: Sample canary
        id: canary
        continue-on-error: true
        run: |
          DATE="${{ github.event.inputs.probe_date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u -d tomorrow +%Y-%m-%d); fi
          echo "Sampling canary against board date $DATE"
          python scripts/probe_kickoff_timezone.py \
            --date "$DATE" --canary-only --timeout 20 \
            --out canary_report.json
      - name: Upload sample
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # same pin as forward_shadow.yml
        with:
          name: forebet-canary-sample
          path: canary_report.json
          if-no-files-found: warn
      - name: Fail the job on an unhealthy sample
        if: steps.canary.outcome == 'failure'
        run: |
          echo "Canary unhealthy this sample — see the probe:canary annotation and the uploaded artifact." >&2
          exit 1
