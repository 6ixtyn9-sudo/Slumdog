name: Probe kickoff timezone (one-shot, read-only)

# One-shot diagnostic for the EVENT_DAY track's timezone hold.
#
# Read-only by construction: `permissions: contents: read`, nothing is
# committed, no evidence tree is touched, no capture is frozen. It makes two
# HTTP requests to the source (football JSON + football HTML board), plus one
# optional extra board, spaced by --pause.
#
# It runs on THIS branch only and exists to be deleted once it has answered:
#   1. does the raw listing HTML carry a machine-readable start instant?
#   2. if not, what timezone offset does the relay render at, measured
#      against the tz=0 football JSON on a match-id join?
#
# Running it on a GitHub runner is the point: that is the exact relay + IP
# combination production uses, so the answer is about the real pipeline and
# not about some other machine's geolocation.

on:
  push:
    branches:
      - arena/01a0dd7a-slumdog
    paths:
      - .github/workflows/probe_kickoff_timezone.yml
      - scripts/probe_kickoff_timezone.py
  workflow_dispatch:
    inputs:
      probe_date:
        description: Board date to probe (YYYY-MM-DD, blank = tomorrow UTC)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # same pin as forward_shadow.yml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # same pin as forward_shadow.yml
        with:
          python-version: '3.13'

      - name: Install
        run: python -m pip install --quiet -e .

      - name: Probe
        id: probe
        continue-on-error: true
        run: |
          DATE="${{ github.event.inputs.probe_date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u -d tomorrow +%Y-%m-%d); fi
          echo "Probing board $DATE"
          python scripts/probe_kickoff_timezone.py \
            --date "$DATE" --sport basketball --pause 20 \
            --out probe_report.json | tee probe_stdout.txt

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # same pin as forward_shadow.yml
        with:
          name: kickoff-timezone-probe
          path: |
            probe_report.json
            probe_stdout.txt
          if-no-files-found: warn
