name: Slumdog Full Forebet Build

on:
  # Optional autonomy: uncomment to run the census + incremental history daily.
  # A full census is heavy on the public relay; start at 02:00 UTC and tune.
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sweep_date:
        description: Research override (YYYY-MM-DD); leave empty for today
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: slumdog-full-build
  cancel-in-progress: false

jobs:
  current-all-details:
    name: Current board — every detail
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: 'Africa/Johannesburg'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - name: Capture every current matchup detail across all sports
        run: |
          SWEEP_DATE="${{ inputs.sweep_date }}"
          if [ -z "$SWEEP_DATE" ]; then SWEEP_DATE="$(date +%F)"; fi
          echo "Census date: $SWEEP_DATE"
          slumdog depth-sweep \
            --date "$SWEEP_DATE" \
            --per-sport 1000000 \
            --workers 6 \
            --relay-pause 62
      - name: Publish current census summary
        if: always()
        run: |
          SWEEP_DATE="${{ inputs.sweep_date }}"
          if [ -z "$SWEEP_DATE" ]; then SWEEP_DATE="$(date +%F)"; fi
          REPORT="data/reports/depth_sweep_$SWEEP_DATE.md"
          if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slumdog-current-depth
          path: |
            data/interim/**
            data/reports/**
          retention-days: 14

  historical-sport:
    name: History — ${{ matrix.sport }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {sport: football, start: '2024-01-01'}
          - {sport: basketball, start: '2023-01-01'}
          - {sport: tennis, start: '2024-01-01'}
          - {sport: hockey, start: '2022-01-01'}
          - {sport: baseball, start: '2024-01-01'}
          - {sport: american_football, start: '2023-01-01'}
          - {sport: rugby, start: '2024-01-01'}
          - {sport: handball, start: '2024-01-01'}
          - {sport: volleyball, start: '2024-01-01'}
          - {sport: cricket, start: '2025-01-01'}
          - {sport: mma, start: '2025-01-01'}
    env:
      TZ: 'Africa/Johannesburg'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Accumulate sport history (skips dates already in the ledger)
        shell: bash
        run: |
          # --end defaults to yesterday from the runner clock; the ledger is
          # resumable, so repeat runs only fetch days not yet covered.
          slumdog backfill-sport \
            --sport "${{ matrix.sport }}" \
            --start "${{ matrix.start }}" \
            --workers 8 \
            --batch-size 18 \
            --delay 62
      - name: Publish sport history receipt
        if: always()
        shell: bash
        run: |
          FILE="$(find data/reports -name 'history_${{ matrix.sport }}*.json' | head -1)"
          if [ -n "$FILE" ]; then
            echo "## ${{ matrix.sport }} history" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$FILE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slumdog-history-${{ matrix.sport }}
          path: data/reports/history_${{ matrix.sport }}*
          retention-days: 30

  aggregate:
    name: Consolidated depth receipt
    if: always()
    needs: [current-all-details, historical-sport]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: slumdog-*
          path: depth-input
      - name: Build consolidated report
        run: |
          python -m slumdog.aggregate \
            --input depth-input \
            --output full_depth_summary.md
          cat full_depth_summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: slumdog-full-depth-summary
          path: full_depth_summary.md
          retention-days: 30

# Dates come from the runner clock in TZ Africa/Johannesburg; dispatch needs no
# target date. History ledgers are rolling and resumable per sport. Esoccer is
# prospective-only. No model training or suggestion emission occurs here.
